<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.R.I.A. — Projects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2345d6ff' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%2345d6ff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0f16; --panel: #0d141d; --card: #16202e; --line: #22314a;
    --text: #d7e2ee; --dim: #7d8fa5; --accent: #45d6ff; --accent-dim: #1b4a5e;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, sans-serif; height: 100vh;
         display: flex; overflow: hidden;
         background-image: radial-gradient(rgba(125,143,165,.08) 1px, transparent 1px);
         background-size: 28px 28px; }
  /* shared sidebar */
  #side { width: 210px; flex: none; background: var(--panel);
          border-right: 1px solid var(--line); display: flex;
          flex-direction: column; padding-top: 14px; }
  #side h1 { font-size: 15px; letter-spacing: 3px; color: var(--accent);
             text-shadow: 0 0 12px rgba(69,214,255,.4); padding: 0 16px 12px; }
  #side a { display: flex; gap: 10px; align-items: center;
            padding: 7px 16px; color: var(--text); text-decoration: none;
            font-size: 13px; }
  #side a:hover { background: var(--card); }
  #side a.here { background: var(--card); color: var(--accent); }
  #side .ico { width: 18px; text-align: center; color: var(--dim); }
  #side-foot { margin-top: auto; padding: 10px 16px; font-size: 11.5px;
               color: var(--dim); border-top: 1px solid var(--line); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--err); margin-right: 6px; }
  .dot.ok { background: var(--ok); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #top { display: flex; align-items: center; gap: 10px;
         padding: 12px 18px; border-bottom: 1px solid var(--line); }
  select, button.btn {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent-dim); color: var(--accent);
                   border-color: #2a6b85; }
  button.danger { color: var(--err); border-color: #5e1b1b; }
  #state-pill { font-size: 12px; border: 1px solid var(--line);
                border-radius: 99px; padding: 2px 10px; color: var(--dim); }
  #state-pill.running { color: var(--ok); border-color: #14532d; }
  #state-pill.warn { color: #fbbf24; border-color: #713f12; }
  .tabs { margin-left: auto; display: flex; gap: 4px; }
  .tabs button { background: none; border: none; color: var(--dim);
                 padding: 6px 10px; font: inherit; cursor: pointer;
                 border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent);
                    border-bottom-color: var(--accent); }

  #view { flex: 1; overflow: auto; padding: 14px 18px; }

  /* kanban */
  #kanban { display: flex; gap: 10px; min-height: 100%; }
  .kcol { flex: 1; min-width: 170px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px;
          display: flex; flex-direction: column; max-height: 100%; }
  .kcol h2 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
             color: var(--dim); padding: 10px 12px 6px; }
  .kcol h2 .n { color: var(--accent); }
  .kcards { overflow-y: auto; padding: 0 8px 8px; display: flex;
            flex-direction: column; gap: 8px; }
  .task { background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .task .t { font-weight: 600; font-size: 13px; }
  .task .m { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 7px;
           border-radius: 99px; border: 1px solid var(--line);
           color: var(--dim); margin: 4px 4px 0 0; }
  .badge.agent { color: var(--accent); border-color: var(--accent-dim); }
  .badge.blocked { color: var(--err); border-color: #5e1b1b; }
  .badge.needs { color: #fbbf24; border-color: #713f12; }
  .task.active { border-color: #7c4a12;
                 box-shadow: 0 0 12px rgba(251,146,60,.15); }

  /* gantt */
  #gantt svg { width: 100%; }
  /* changelog / report / detail */
  pre.doc { background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 14px; white-space: pre-wrap;
            overflow-wrap: anywhere; font-size: 13px;
            font-family: inherit; }
  #empty { color: var(--dim); margin-top: 10vh; text-align: center; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(4,8,14,.8);
             display: none; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .overlay .box { background: var(--panel); border: 1px solid var(--line);
                  border-radius: 12px; width: min(760px, 92vw);
                  max-height: 84vh; display: flex; flex-direction: column; }
  .overlay h3 { padding: 12px 16px; font-size: 13px; color: var(--accent);
                border-bottom: 1px solid var(--line);
                font-family: var(--mono); }
  .overlay pre { padding: 14px 16px; overflow: auto; white-space: pre-wrap;
                 overflow-wrap: anywhere; font-size: 12.5px; }
  #modal-approve { display: none; margin: 0 16px 14px;
                   align-self: flex-start; }
  #modal-approve.show { display: inline-block; }
</style>
</head>
<body>
<aside id="side">
  <h1>A.R.I.A.</h1>
  <a href="/"        ><span class="ico">◆</span> Chat</a>
  <a href="/projects" class="here"><span class="ico">▣</span> Projects</a>
  <a href="/board"   ><span class="ico">▦</span> Pipeline board</a>
  <a href="/agents"  ><span class="ico">⬡</span> Agents</a>
  <a href="/orb"     ><span class="ico">◉</span> Orb</a>
  <div id="side-foot"><span class="dot" id="dot"></span><span id="health-txt">checking…</span></div>
</aside>

<main id="main">
  <div id="top">
    <select id="proj"></select>
    <span id="state-pill">idle</span>
    <button class="btn" id="btn-plan">Plan</button>
    <button class="btn primary" id="btn-start">▶ Start autopilot</button>
    <button class="btn danger" id="btn-stop">■ Stop</button>
    <div class="tabs">
      <button class="on" data-v="kanban">Board</button>
      <button data-v="gantt">Gantt</button>
      <button data-v="changelog">Changelog</button>
      <button data-v="report">Report</button>
    </div>
  </div>
  <div id="view"><div id="empty">Pick a project — or create one by telling
  A.R.I.A. to capture an idea. Then "Plan" to see the task breakdown, and
  "Start autopilot" to let her work it continuously.</div></div>
</main>

<div class="overlay" id="modal"><div class="box">
  <h3 id="modal-title"></h3><pre id="modal-body"></pre>
  <button class="btn primary" id="modal-approve">✓ Approve — let autopilot
  run this task</button></div></div>

<script>
const $ = s => document.querySelector(s);
let cur = null, data = null, view = 'kanban', timer = null;

async function health() {
  try {
    const h = await (await fetch('/api/health')).json();
    $('#dot').className = 'dot' + (h.ok ? ' ok' : '');
    $('#health-txt').textContent = h.ok ? h.model : 'engine offline';
  } catch { $('#health-txt').textContent = 'server unreachable'; }
}

async function loadProjects() {
  const r = await (await fetch('/api/projects')).json();
  const sel = $('#proj'); const prev = cur;
  sel.replaceChildren();
  for (const p of r.projects) {
    const o = document.createElement('option');
    o.value = p.slug;
    o.textContent = `${p.slug}  (${p.kind}${p.autopilot === 'running' ? ' · running' : ''})`;
    sel.appendChild(o);
  }
  if (r.projects.length) {
    cur = prev && r.projects.some(p => p.slug === prev) ? prev
        : r.projects[0].slug;
    sel.value = cur;
    await loadProject();
  }
}

async function loadProject() {
  if (!cur) return;
  data = await (await fetch('/api/project?slug=' + encodeURIComponent(cur))).json();
  const st = data.state.status || 'idle';
  const pill = $('#state-pill');
  pill.textContent = st + (st === 'running' ? ` · iter ${data.state.iteration}`
    : st === 'stalled' ? ' — no progress, needs you'
    : st === 'budget' ? ' cap reached' : '');
  pill.className = st === 'running' ? 'running'
    : (st === 'stalled' || st === 'budget') ? 'warn' : '';
  pill.id = 'state-pill';
  render();
}

function depsMet(t, doneIds) {
  return t.depends_on.every(d => doneIds.has(d));
}

function render() {
  const v = $('#view'); v.replaceChildren();
  if (!data) return;
  if (view === 'kanban') renderKanban(v);
  else if (view === 'gantt') renderGantt(v);
  else if (view === 'changelog') {
    const p = document.createElement('pre'); p.className = 'doc';
    p.textContent = data.changelog || 'no changes yet';
    v.appendChild(p);
  } else {
    const p = document.createElement('pre'); p.className = 'doc';
    p.textContent = data.report ||
      'the final report appears here when a run completes or you stop it';
    v.appendChild(p);
  }
}

function renderKanban(v) {
  const tasks = data.plan.tasks || [];
  const doneIds = new Set(tasks.filter(t => t.status === 'done').map(t => t.id));
  const cols = [
    ['To Do',       t => t.status === 'todo' && depsMet(t, doneIds)],
    ['Planning',    t => t.status === 'todo' && !depsMet(t, doneIds)],
    ['In Progress', t => t.status === 'inprogress'],
    ['Reviewing',   t => t.status === 'reviewing' || t.status === 'blocked'],
    ['Done',        t => t.status === 'done'],
  ];
  const k = document.createElement('div'); k.id = 'kanban';
  for (const [name, fn] of cols) {
    const col = document.createElement('div'); col.className = 'kcol';
    const items = tasks.filter(fn);
    col.innerHTML = `<h2>${name} <span class="n">${items.length || ''}</span></h2>`;
    const cards = document.createElement('div'); cards.className = 'kcards';
    for (const t of items) {
      const d = document.createElement('div');
      d.className = 'task' + (t.status === 'inprogress' ? ' active' : '');
      d.innerHTML = `<div class="t"></div><div class="m"></div>`;
      d.querySelector('.t').textContent = t.title;
      d.querySelector('.m').textContent = t.phase + ' · ~' + t.est_hours + 'h';
      const a = document.createElement('span');
      a.className = 'badge agent'; a.textContent = t.agent;
      d.appendChild(a);
      if (t.model) { const b = document.createElement('span');
        b.className = 'badge'; b.textContent = t.model; d.appendChild(b); }
      if (t.status === 'blocked') { const b = document.createElement('span');
        b.className = 'badge blocked'; b.textContent = 'blocked'; d.appendChild(b); }
      if (t.needs_human && t.status !== 'done') {
        const b = document.createElement('span');
        b.className = 'badge needs'; b.textContent = 'needs you'; d.appendChild(b); }
      for (const s of t.skills || []) { const b = document.createElement('span');
        b.className = 'badge'; b.textContent = s; d.appendChild(b); }
      d.onclick = () => openTask(t);
      cards.appendChild(d);
    }
    col.appendChild(cards); k.appendChild(col);
  }
  v.appendChild(k);
}

function renderGantt(v) {
  const tasks = data.plan.tasks || [];
  if (!tasks.length) { v.innerHTML = '<div id="empty">no plan yet — hit Plan</div>'; return; }
  // topological start times from dependencies + estimates
  const by = Object.fromEntries(tasks.map(t => [t.id, t]));
  const start = {}, end = {};
  const calc = (t, seen) => {
    if (end[t.id] !== undefined) return end[t.id];
    if (seen.has(t.id)) { start[t.id] = 0; end[t.id] = t.est_hours; return end[t.id]; }
    seen.add(t.id);
    start[t.id] = Math.max(0, ...t.depends_on.map(d => by[d] ? calc(by[d], seen) : 0));
    end[t.id] = start[t.id] + (t.est_hours || 1);
    return end[t.id];
  };
  tasks.forEach(t => calc(t, new Set()));
  const total = Math.max(...tasks.map(t => end[t.id]));
  const W = 900, LAB = 260, ROW = 30;
  const colors = {}; let ci = 0;
  const palette = ['#45d6ff', '#4ade80', '#fbbf24', '#c084fc', '#fb7185', '#34d399'];
  const g = document.createElement('div'); g.id = 'gantt';
  let rows = '';
  tasks.forEach((t, i) => {
    if (!(t.phase in colors)) colors[t.phase] = palette[ci++ % palette.length];
    const x = LAB + (start[t.id] / total) * (W - LAB - 20);
    const w = Math.max(6, ((t.est_hours || 1) / total) * (W - LAB - 20));
    const y = 24 + i * ROW;
    const col = colors[t.phase];
    const op = t.status === 'done' ? 1 : t.status === 'inprogress' ? .8 : .35;
    rows += `<text x="4" y="${y + 15}" fill="#7d8fa5" font-size="11">${
      t.id} · ${t.title.slice(0, 34).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>` +
      `<rect x="${x}" y="${y + 4}" width="${w}" height="14" rx="4" fill="${col}" opacity="${op}"/>`;
    for (const d of t.depends_on) if (by[d] !== undefined && end[d] !== undefined) {
      const dx = LAB + (end[d] / total) * (W - LAB - 20);
      rows += `<line x1="${dx}" y1="${24 + tasks.indexOf(by[d]) * ROW + 11}" x2="${x}" y2="${y + 11}" stroke="#22314a" stroke-width="1"/>`;
    }
  });
  const legend = Object.entries(colors).map(([p, c], i) =>
    `<rect x="${LAB + i * 140}" y="2" width="10" height="10" rx="2" fill="${c}"/>` +
    `<text x="${LAB + i * 140 + 14}" y="11" fill="#7d8fa5" font-size="11">${p.slice(0, 16)}</text>`).join('');
  g.innerHTML = `<svg viewBox="0 0 ${W} ${24 + tasks.length * ROW + 10}">${legend}${rows}</svg>`;
  v.appendChild(g);
}

async function openTask(t) {
  $('#modal-title').textContent = t.id + ' — ' + t.title;
  let body = `agent: ${t.agent}   model: ${t.model || 'agent default'}   status: ${t.status}` +
             (t.needs_human && t.status !== 'done' ? '   ⚠ waiting on your approval' : '') +
             `\ndone when: ${t.done_when}\n\n${t.detail}`;
  const ap = $('#modal-approve');
  if (t.needs_human && t.status !== 'done') {
    ap.classList.add('show');
    ap.onclick = async () => {
      await fetch('/api/approve-task', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: cur, id: t.id }) });
      $('#modal').classList.remove('open');
      loadProject();
    };
  } else ap.classList.remove('show');
  if (data.dir) {
    try {
      const r = await (await fetch('/api/note?path=' + encodeURIComponent(
        data.dir + '/autopilot/task-' + t.id + '.md'))).json();
      if (r.content) body += '\n\n──── output ────\n\n' + r.content;
    } catch {}
  }
  $('#modal-body').textContent = body;
  $('#modal').classList.add('open');
}
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); };

$('#proj').onchange = () => { cur = $('#proj').value; loadProject(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); view = b.dataset.v; render();
});

$('#btn-start').onclick = async () => {
  await fetch('/api/autopilot', { method: 'POST',
    body: JSON.stringify({ slug: cur, action: 'start' }) });
  loadProject();
};
$('#btn-stop').onclick = async () => {
  await fetch('/api/autopilot', { method: 'POST',
    body: JSON.stringify({ slug: cur, action: 'stop' }) });
  loadProject();
};
$('#btn-plan').onclick = async () => {
  $('#btn-plan').disabled = true; $('#btn-plan').textContent = 'Planning…';
  try {
    const resp = await fetch('/api/plan', { method: 'POST',
      body: JSON.stringify({ slug: cur }) });
    await resp.text(); // consume the stream
  } catch {}
  $('#btn-plan').disabled = false; $('#btn-plan').textContent = 'Plan';
  loadProject();
};

health(); loadProjects();
setInterval(() => { health(); if (cur) loadProject(); }, 12000);
setInterval(loadProjects, 60000);
</script>
</body>
</html>
