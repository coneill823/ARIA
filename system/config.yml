# A.R.I.A. pipeline configuration — the defaults, and what each setting does.
#
# Don't keep your own values here: this file is replaced when A.R.I.A. is
# updated. Yours go in system/config.local.yml (same keys; whatever is set
# there wins), which updates never touch. The Settings page writes there,
# and so does:   aria settings set <key> <value>
# If you did edit this file, `aria update` carries your edits over for you.
aria:
  # Which engine bin/aria uses for the automated stages (triage, develop).
  #   ollama — fully local & private; great for triage, drafts plans
  #   claude — full capability via headless Claude Code (web research,
  #            subagents)
  # Slash commands inside a Claude Code session always use Claude.
  # Override per-run with the ARIA_ENGINE environment variable.
  engine: ollama

  # ---- model tiers -------------------------------------------------
  # Each tier is  <backend>/<model>.  Backends are defined below:
  #   ollama   — Ollama's native API (handles model downloads for you)
  #   llamacpp — any OpenAI-compatible server (llama.cpp llama-server
  #              with Vulkan — see bin/aria-llama — LM Studio, vLLM…)
  # Which tier runs what:
  #   fast  — triage, voice chat, quick replies
  #   smart — develop (plans/research) and agents
  #   deep  — optional heavy thinker for long planning runs; agents can
  #           request it with  model: deep.  Empty = falls back to smart.
  # Upgrade path on a 16GB-VRAM / 64GB-RAM box (fully local, private):
  #   ollama pull qwen3:30b      ->  smart: ollama/qwen3:30b
  #   ollama pull gpt-oss:120b   ->  deep:  ollama/gpt-oss:120b
  # Faster still: bin/aria-llama install && bin/aria-llama serve smart,
  # then                             smart: llamacpp/qwen3-30b
  models:
    fast: ollama/llama3.1:8b
    smart: ollama/llama3.1:8b
    deep:
  # ---- the giants: one model per role, loaded when work needs it ----
  # Very large GGUF models (bigger than RAM — llama.cpp streams them from
  # NVMe; see docs/BIG-MODELS.md). Give each role the FIRST part of its
  # model (…-00001-of-0000N.gguf). A.R.I.A. starts a role's llama-server
  # when a task needs it and unloads the others first; a model that is
  # still downloading is skipped until every part is complete.
  # Easiest: Settings → Giant models → Find models.
  giant_general:
  giant_research:
  giant_coder:
  # auto   = a giant gets the tasks the planner marks as hard, and the
  #          last attempt at a task an everyday model had sent back twice
  #          (they answer at ~0.5–2 words a second, so not everything)
  # always = every coding task to coder, research to research, the rest
  #          to general — strongest, slowest
  # never  = giants only where you name them yourself
  # Prove a giant loads and answers:  bin/aria models test general
  giants_use: auto
  # How many giants may be loaded at once; unload one after this many
  # minutes unused, so it does not sit on the memory when nothing needs
  # it (0 = keep it loaded); the first port (general uses it, research
  # the next, coder the one after).
  giants_loaded: 1
  giants_idle_minutes: 20
  giants_port: 8090
  # Giants and Ollama's everyday models take turns with the memory: before
  # a giant loads, Ollama unloads what it holds; before an everyday model
  # is used, a giant that has finished its answer is unloaded (never one
  # mid-answer). Off = both stay where they are, which only works if the
  # machine holds both at once.
  giants_free_memory: true
  # Each giant's context window, in tokens. Prompts for a giant are sized
  # to it. Bigger costs real RAM for the whole time the giant is loaded —
  # raise it only if `free -h` shows room to spare.
  giants_ctx: 8192
  # Extra llama-server flags for every giant, appended after the preset's
  # own so they win — e.g. "-ngl 20" if loading runs out of VRAM beside
  # your everyday model, or "--threads 16".
  giants_flags:
  # Backends: any name -> base URL. "ollama" speaks Ollama's native API;
  # every other name is treated as OpenAI-compatible (/v1/chat/completions):
  # llama.cpp llama-server, LM Studio, vLLM, OmniRoute, colibri (coli serve),
  # soup serve... If one needs an API key, add it under backend_keys with
  # the same name (or env ARIA_KEY_<NAME>); keys here are stored in plain
  # text, so prefer the env var for anything sensitive.
  backends:
    ollama: http://localhost:11434
    llamacpp: http://localhost:8080
    # omniroute: http://localhost:20128
    # colibri: http://localhost:8338
  backend_keys:
    # omniroute: your-omniroute-key

  # ---- reach: webhooks & monitoring --------------------------------
  # Webhooks A.R.I.A. is ALLOWED to fire — say "trigger <name>" in chat or
  # run `aria trigger <name>`. Point these at n8n webhook nodes, Home
  # Assistant, deploy hooks... She can only ever reach names listed here.
  webhooks:
    # morning-digest: http://localhost:5678/webhook/morning-digest
    # deploy-site: http://localhost:5678/webhook/deploy-site

  # Uptime Kuma "push" monitor URL — pinged after each successful
  # auto-pipeline pass so your monitoring notices if A.R.I.A. stops.
  heartbeat_url:

  # Legacy single-model keys — still honored as the default for `fast`.
  ollama:
    base_url: http://localhost:11434
    model: llama3.1:8b

  # ---- her voice and her ears ---------------------------------------
  # `bin/aria voice install` sets up speech on this machine: Piper for a
  # natural voice, faster-whisper to understand you, both in a private
  # environment under vendor/voice/. Nothing you say leaves the machine.
  # Without it: espeak-ng (a plain voice) if installed, else whatever the
  # browser offers — and her own desktop window offers nothing.
  #
  # Where her voice is made, and where yours is recognised:
  #   auto    = on this machine when it can be, else the browser's own
  #   local   = on this machine only
  #   browser = the browser's own (Chrome sends audio to Google for it)
  voice_engine: auto
  voice_input: auto
  # Which voice (`bin/aria voice voices` lists them; empty = the one that
  # was installed), and how fast she speaks: 0.5 (slow) to 2 (fast).
  voice_name:
  voice_speed: 1.0
  # The recognition model. Sizes: tiny, base, small, medium (bigger hears
  # better and takes longer; it is downloaded the first time it is used).
  stt_model: base

  # ---- Alexa ----------------------------------------------------------
  # `bin/aria alexa` walks through this and says what is left; the whole
  # story is docs/ALEXA.md. alexa_url is the public https address of your
  # tunnel to the voice gateway (port 8701 — never 8700), and
  # alexa_skill_id (amzn1.ask.skill.…) makes the gateway answer your
  # skill only.
  alexa_url:
  alexa_skill_id:

  # When capturing from the web UI, automatically run triage and then
  # develop whatever became a project — idea in, proposed plan out.
  auto_pipeline: true

  # Absolute path to your Obsidian vault to enable the UI's "→ Obsidian"
  # button (exports a project's idea/research/plan plus an index note with
  # tags and wikilinks into <vault>/ARIA/). Empty = disabled.
  # e.g. obsidian_vault: /home/you/Documents/SecondBrain
  obsidian_vault:

  # Where /promote-project moves approved projects.
  # Relative paths are resolved from the aria/ root.
  # On your own machine, point this at e.g. ~/Documents/Projects
  promotion_target: ./active-projects

  # Triage categories and where non-project items get filed.
  categories:
    project:  pipeline/01-processing           # moves on to /develop
    task:     pipeline/knowledge/lists         # appended to the matching list
    note:     pipeline/knowledge/notes
    content:  pipeline/knowledge/content-ideas
    someday:  pipeline/knowledge/someday
    unclear:  pipeline/00-inbox                # stays put with questions attached

  # Named lists that `task` items append to. Triage picks the best match,
  # falling back to tasks.md.
  lists:
    grocery: pipeline/knowledge/lists/grocery.md
    tasks:   pipeline/knowledge/lists/tasks.md

  # Minimum triage confidence before auto-filing (else marked unclear).
  triage_confidence_threshold: 0.7

  # Whether /develop may use web search for research.
  research_web_access: true

  # ---- reach: the internet ------------------------------------------
  # On: "search for …" and "read <url>" are real actions in chat and voice,
  # the develop stage researches ideas on the live web, and autopilot
  # tasks marked research get sourced material. Search queries leave your
  # machine when this is on — switch it off here (or in Settings) for a
  # fully offline A.R.I.A.; she then says plainly that she cannot browse.
  web_access: true

  # Where searches go:
  #   auto        your SearxNG if web_search_url is set, else Brave if a key
  #               is set, else DuckDuckGo, else Wikipedia — first to answer
  #   duckduckgo  no key, no setup (the no-JavaScript results page)
  #   brave       official API — free key from brave.com/search/api, put it
  #               in the environment as ARIA_KEY_BRAVE
  #   searxng     your own instance (most private): set web_search_url
  #   wikipedia   encyclopedia only
  #   none        fetch pages you name, but never search
  web_search: auto

  # Your self-hosted SearxNG search endpoint, JSON format enabled, e.g.
  #   web_search_url: http://localhost:8888/search
  web_search_url:

  # Optional: confine page fetching to these sites (comma-separated).
  # Empty = any public site. Your local network is always off limits —
  # private, loopback and link-local addresses are refused.
  #   web_allowlist: en.wikipedia.org, docs.python.org, github.com
  web_allowlist:

  # ---- reach: git and GitHub ---------------------------------------
  # Autopilot commits every verified task when the project is its own git
  # repository (never inside a repository that merely contains it), on the
  # branch aria/autopilot — your base branch is never committed to.
  autopilot_git: true

  # GitHub is off until you say so. On: `aria github publish <slug>`
  # creates a private repository for a project, and autopilot pushes its
  # branch and keeps a pull request open as it works. Needs the gh CLI,
  # signed in once with `gh auth login` (or a token in ARIA_GITHUB_TOKEN).
  github_access: false
  github_base_branch: main

  # ---- autopilot ----------------------------------------------------
  # Context window, in tokens, requested from Ollama for every call (its
  # own default silently truncates long prompts) and used to size prompts.
  # A model's prompt, its reasoning and its answer all have to fit in it.
  # Raise it if your models and VRAM allow (16384 is a good next step);
  # 0 leaves the backend's own setting alone.
  context_tokens: 8192
  # Models that reason at length before they answer (qwen3, deepseek-r1…).
  # Reasoning costs time, and room in the window above.
  #   auto   = the quick tier answers straight away (chat, triage and
  #            summaries stay quick); the smart tier reasons when the
  #            window has room for the reasoning AND the answer — a larger
  #            context_tokens lets her think more; the deep tier, models
  #            you name yourself and the giants are left as they are
  #   always = leave every model to itself
  #   never  = ask every Ollama model for the answer alone
  # A reply that is cut off because the reasoning filled the window is
  # asked for again without it, whatever this is set to.
  thinking: auto

  # After the goal is met and audited:  improve = keep going with
  # improvements until you stop her (or she runs out of improvements
  # worth making);  stop = write the final report and stand down.
  autopilot_after_goal: improve

  # Optional budgets for one run, 0 = no limit: task attempts, batches,
  # wall-clock hours. When one is reached she finishes the step in flight,
  # writes the report and stands down as "budget reached". Starting her
  # again is a new run with a new budget.
  autopilot_max_tasks: 0
  autopilot_max_iterations: 0
  autopilot_max_hours: 0

  # She pauses herself as "stalled" — and writes the report — after this
  # many batches in a row that complete nothing, or this many plans in a
  # row that add nothing.
  autopilot_stall_limit: 3

  # Run the project's own tests after every code change:
  #   sandbox = yes, inside bubblewrap — no network, the machine read-only,
  #             a scratch copy of the project the only thing writable.
  #             Without bubblewrap they are not run, and the report says so
  #             (Arch: sudo pacman -S bubblewrap).
  #   direct  = yes, without a sandbox (a scratch copy, your permissions)
  #   off     = never
  # A change that makes passing tests fail is rejected and rolled back.
  autopilot_checks: sandbox
  # Seconds one test run may take before it is stopped.
  autopilot_check_seconds: 300

  # When the goal is met — and again after every few more changes — read
  # the whole codebase, write up what is worth changing (REVIEW.md) and
  # refine it without changing what it does.
  autopilot_refine: true

  # Minutes a fast/smart model may stay silent before an attempt is
  # abandoned and retried. The deep tier and hand-picked models are never
  # cut off — a giant can take an hour to produce its first token.
  autopilot_idle_minutes: 30

  # ---- your desktop ---------------------------------------------------
  # The Files tab's "Open in editor" and "Terminal here". Empty = the
  # first one found on this machine (code, zed, kate, …; konsole,
  # gnome-terminal, kitty, …). Set a command to choose: `editor: code`
  # (the file or folder is added at the end), `terminal: konsole --workdir`
  # (the folder follows a trailing option, or goes where you write {dir}).
  editor:
  terminal:
  # A notification on your desktop when a task waits on your decision and
  # when a run ends (needs notify-send, which most desktops have).
  desktop_notifications: true

  # ---- the Obsidian brain -------------------------------------------
  # With obsidian_vault set (above), she writes into <vault>/ARIA/ only:
  # project hubs, notes you dictate ("note to brain: …"), research she
  # did, and — when this is on — a daily journal of what she worked on.
  brain_journal: true
